{% extends "base.html" %}



{% block content %}




<div class="login-container">




    <div class="login-card">




        <h1>

            用户登录

            <br>

            Login

        </h1>





        {% with messages = get_flashed_messages(with_categories=true) %}


            {% if messages %}


                {% for category, message in messages %}


                <div class="alert {{ category }}">

                    {{ message }}

                </div>


                {% endfor %}

            {% endif %}



        {% endwith %}







        <form method="post">




            <input
            type="text"
            name="username"
            placeholder="Username 用户名">





            <br>





            <input
            type="password"
            name="password"
            placeholder="Password 密码">





            <br>





            <button type="submit">


                登录 Login


            </button>




        </form>




    </div>




</div>




{% endblock %}
