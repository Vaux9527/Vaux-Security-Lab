{# ============================================================
   可执行结构速查表（XSS Level 1 / Level 2 共用）

   为什么要这张表：
   "让浏览器执行 JavaScript" 的写法不止一种，但初学者往往只知道
   <script> 这一种。于是当过滤挡掉 script 之后，提示里突然出现
   <img src=x onerror=...> 就变成了"一串没见过的东西"。

   这张表给的是**招式表**，不是答案：
   它讲清楚"哪几类写法能执行、为什么能执行"，
   但哪一招在你面前这一关能生效、为什么，仍然要自己判断。
   ============================================================ #}

<details class="cheatsheet">

    <summary>
        可执行结构速查表 Payload Cheatsheet（点开看，卡住时用）
    </summary>

    <p class="hint-note">

        浏览器执行 JavaScript 的入口不止 <code>&lt;script&gt;</code> 一个。
        下面每一行的「为什么能执行」才是重点 —— 理解了它，你就能自己造新的写法，
        而不是背 payload。

        <br>

        A browser has more than one way to run JavaScript. The middle column
        matters most: once you understand <em>why</em> each one fires, you can
        invent your own instead of memorising payloads.

    </p>

    <table class="result-table">

        <thead>
            <tr>
                <th>写法 Payload</th>
                <th>为什么能执行 Why it runs</th>
                <th>什么时候用得上 When</th>
            </tr>
        </thead>

        <tbody>

            {% for row in cheatsheet %}

            <tr>

                <td><code>{{ row.code }}</code></td>
                <td>{{ row.why }}</td>
                <td>{{ row.when }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

    <p class="hint-note">

        共同点：它们都会被浏览器解析成<b>标记（markup）</b>，而不是文字。
        所以真正的修复从来不是"过滤掉某几个词"，而是<b>输出编码</b> ——
        让输入永远只是文字。

        <br>

        The common thread: all of them get parsed as <b>markup</b> instead of text.
        That is why the real fix is output encoding, never a word blacklist.

    </p>

</details>
